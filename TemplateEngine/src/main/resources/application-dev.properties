ons:\n      </p></td></tr></table></div></div></td></tr><tr _ngcontent-ljs-c412=\"\"><td _ngcontent-ljs-c412=\"\" colspan=\"3\"><div _ngcontent-ljs-c412=\"\" style=\"margin-top: 30px;\"><div _ngcontent-ljs-c412=\"\" class=\"d-flex justify-content-between\"><b _ngcontent-ljs-c412=\"\">1. General Conditions</b></div></div></td></tr><tr _ngcontent-ljs-c412=\"\"><td _ngcontent-ljs-c412=\"\" colspan=\"3\"><app-stage-condition _ngcontent-ljs-c412=\"\" conditiontype=\"general\" _nghost-ljs-c411=\"\"><div _ngcontent-ljs-c411=\"\" class=\"general\"><section _ngcontent-ljs-c411=\"\" class=\"dashboard-section\"><div _ngcontent-ljs-c411=\"\" class=\"dashboard-content\"><div _ngcontent-ljs-c411=\"\" class=\"project-list-card\"><div _ngcontent-ljs-c411=\"\"><div _ngcontent-ljs-c411=\"\"><div _ngcontent-ljs-c411=\"\" class=\"\" style=\"margin-bottom:5px\"><div _ngcontent-ljs-c411=\"\" class=\"col text-end print-d-none\" style=\"display: none;\"><button _ngcontent-ljs-c411=\"\" type=\"button\" class=\"btn rounded-pill btn-add-more\"> Add <span _ngcontent-ljs-c411=\"\" class=\"ms-1\"><svg _ngcontent-ljs-c411=\"\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path _ngcontent-ljs-c411=\"\" d=\"M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path _ngcontent-ljs-c411=\"\" d=\"M12 8V16\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path _ngcontent-ljs-c411=\"\" d=\"M8 12H16\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></span></button></div></div><div _ngcontent-ljs-c411=\"\" class=\"col-md-12\" style=\"margin-bottom:5px\"><div _ngcontent-ljs-c411=\"\" class=\"add-more-list table-responsive mb-4\"><table _ngcontent-ljs-c411=\"\" class=\"\" style=\"b