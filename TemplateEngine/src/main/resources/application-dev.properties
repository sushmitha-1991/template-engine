: nowrap; text-align: center; display: none;\"><div _ngcontent-ljs-c411=\"\" class=\"cursor-pointer\"><i _ngcontent-ljs-c411=\"\" class=\"fa fa-trash\" style=\"font-size: 16px; color: red;\"></i></div></td></tr><tr _ngcontent-ljs-c411=\"\"><th _ngcontent-ljs-c411=\"\" class=\"text-center\" style=\"padding: 10px; border: 1px solid #000; width: 4rem;\"> 1.3 </th><td _ngcontent-ljs-c411=\"\" style=\"padding: 10px; border: 1px solid #000;\">The non-forest land identified for raising compensatory afforestation shall be transferred and mutated in favour of the State Forest Department before issue of the Stage-II clearance</td><td _ngcontent-ljs-c411=\"\" class=\"text-center print-d-none\" style=\"padding: 10px; border: 1px solid rgb(0, 0, 0); white-space: nowrap; text-align: center; display: none;\"><div _ngcontent-ljs-c411=\"\" class=\"cursor-pointer\"><i _ngcontent-ljs-c411=\"\" class=\"fa fa-trash\" style=\"font-size: 16px; color: red;\"></i></div></td></tr></tbody></table></div></div></div></div></div></div></section></div></app-stage-condition></td></tr><tr _ngcontent-ljs-c412=\"\"><td _ngcontent-ljs-c412=\"\" colspan=\"3\"><div _ngcontent-ljs-c412=\"\" style=\"margin-top: 30px;\"><div _ngcontent-ljs-c412=\"\" class=\"d-flex justify-content-between\"><b _ngcontent-ljs-c412=\"\">2. Standard conditions</b></div></div></td></tr><tr _ngcontent-ljs-c412=\"\"><td _ngcontent-ljs-c412=\"\" colspan=\"3\"></td></tr><tr _ngcontent-ljs-c412=\"\"><td _ngcontent-ljs-c412=\"\" colspan=\"3\"><app-stage-condition _ngcontent-ljs-c412=\"\" conditiontype=\"standard\" _nghost-ljs-c411=\"\"><div _ngcontent-ljs-c411=\"\" class=\"standard\"><section _ngcontent-ljs-c411=\"\" class=\"dashboard-section\"><div _ngcontent-ljs-c411=\"\" class=\"dashboard-content\"><div _ngcontent-ljs-c411=\"\" class=\"project-list-card\"><div _ngcontent-ljs-c411=\"\"><div _ngcontent-ljs-c411=\"\"><div _ngcontent-ljs-c411=\"\" class=\"\" style=\"margin-bottom:5px\"><div _ngcontent-ljs-c411=\"\" class=\"col text-en