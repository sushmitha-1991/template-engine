 permitted in other non-built up areas. Felling of trees before the start of construction should be verified by the concerned DFO. </td><td _ngcontent-ljs-c411=\"\" class=\"text-center print-d-none\" style=\"padding: 10px; border: 1px solid rgb(0, 0, 0); white-space: nowrap; text-align: center; display: none;\"><div _ngcontent-ljs-c411=\"\" class=\"cursor-pointer\"><i _ngcontent-ljs-c411=\"\" class=\"fa fa-trash\" style=\"font-size: 16px; color: red;\"></i></div></td></tr><tr _ngcontent-ljs-c411=\"\"><th _ngcontent-ljs-c411=\"\" class=\"text-center\" style=\"padding: 10px; border: 1px solid #000; width: 4rem;\"> 2.2 </th><td _ngcontent-ljs-c411=\"\" style=\"padding: 10px; border: 1px solid #000;\">Only built-up area should be fenced so that other areas are available for free movement of animals. </td><td _ngcontent-ljs-c411=\"\" class=\"text-center print-d-none\" style=\"padding: 10px; border: 1px solid rgb(0, 0, 0); white-space: nowrap; text-align: center; display: none;\"><div _ngcontent-ljs-c411=\"\" class=\"cursor-pointer\"><i _ngcontent-ljs-c411=\"\" class=\"fa fa-trash\" style=\"font-size: 16px; color: red;\"></i></div></td></tr><tr _ngcontent-ljs-c411=\"\"><th _ngcontent-ljs-c411=\"\" class=\"text-center\" style=\"padding: 10px; border: 1px solid #000; width: 4rem;\"> 2.3 </th><td _ngcontent-ljs-c411=\"\" style=\"padding: 10px; border: 1px solid #000;\">Along the arterial roads, natural forests should be maintained;</td><td _ngcontent-ljs-c411=\"\" class=\"text-center print-d-none\" style=\"padding: 10px; border: 1px solid rgb(0, 0, 0); white-space: nowrap; text-align: center; display: none;\"><div _ngcontent-ljs-c411=\"\" class=\"cursor-pointer\"><i _ngcontent-ljs-c411=\"\" class=\"fa fa-trash\" style=\"font-size: 16px; color: red;\"></i></div></td></tr><tr _ngcontent-ljs-c411=\"\"><th _ngcontent-ljs-c411=\"\" class=\"text-center\" style=\"padding: 10px; border: 1px solid #000; width: 4rem;\"> 2.4 </th><td _ngcontent-ljs-c411=\"\" style=\"padding: 10px; border: 1px solid #000;\">In case of blank areas along the roads planting of trees should be done in at least 5-meter wide strip. </td><td _ngcontent-ljs-c411=\"\" class=\"text-center print-d-none\" style=\"padding: 10px; border: 1px solid rgb(0, 0, 0); white-space: nowrap; text-align: center; display: none;\"><div _ngcontent-ljs-c411=\"\" class=\"cursor-pointer\"><i _ngcontent-ljs-c411=\"\" class=\"fa fa-trash\" style=\"font-size: 16px; color: red;\"></i></div></td></tr><tr _ngcontent-ljs-c411=\"\"><th _ngcontent-ljs-c411=\"\" class=\"text-center\" style=\"padding: 10px; border: 1px solid #000; width: 4rem;\"> 2.5 </th><td _ngcontent-ljs-c411=\"\" style=\"padding: 10px; border: 1px solid #000;\">The user agency shall assist the State Government in conservation and preservation of the flora and fauna of the area in accordance with the plan prepared by the Chief Wildlife Warden of the State</td><td _ngcontent-ljs-c411=\"\" class=\"text-center print-d-none\" style=\"padding: 10px; border: 1px solid rgb(0, 0, 0); white-space: nowrap; text-align: center; display: none;\"><div _ngcontent-ljs-c411=\"\" class=\"cursor-pointer\"><i _ngcontent-ljs-c411=\"\" class=\"fa fa-trash\" style=\"font-size: 16px; color: red;\"></i></div></td></tr></tbody></table></div></div></div></div></div></div></section></div></app-stage-condition></td></tr><tr _ngcontent-ljs-c412=\"\"><td _ngcontent-ljs-c412=\"\" colspan=\"3\"><div _ngcontent-ljs-c412=\"\" style=\"margin-top: 30px;\"><div _ngcontent-ljs-c412=\"\" class=\"d-flex justify-content-between\"><b _ngcontent-ljs-c412=\"\">3. Specific Conditions</b></div></div></td></tr><tr _ngcontent-ljs-c412=\"\"><td _ngcontent-ljs-c412=\"\" colspan=\"3\"><div _ngcontent-ljs-c412=\"\" class=\"project-list-card\"><div _ngcontent-ljs-c412=\"\"><div _ngcontent-ljs-c412=\"\"><div _ngcontent-ljs-c412=\"\" class=\"\" style=\"margin-bottom:5px\"><div _ngcontent-ljs-c412=\"\" class=\"col text-end print-d-none\" style=\"display: none;\"><button _ngcontent-ljs-c412=\